services:
  postgres:
    image: postgres:16-alpine
    container_name: talentx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TalentX@Local2026
    ports:
      - "5432:5432"
    volumes:
      - talentx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentx"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  talentx_pgdata: